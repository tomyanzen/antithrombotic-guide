<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Meiryo','Yu Gothic',sans-serif;background:#f0f4f8;color:#1a1a2e;font-size:15px;min-height:100vh}
#app{max-width:700px;margin:0 auto;padding-bottom:40px}
.header{background:#1F3864;color:white;padding:14px 20px;position:sticky;top:0;z-index:10}

.content{padding:20px}

.sub-label{font-size:12px;color:#888;font-weight:bold;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.drug-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drug-item{border:2px solid #D5E8F0;border-radius:8px;padding:10px 12px;cursor:pointer;background:white;transition:all .15s;user-select:none}
.drug-item.sel{border-color:#2E75B6;background:#EBF4FA}
.drug-item:hover{border-color:#2E75B6}
.dn{font-weight:bold;font-size:14px;color:#1F3864}
.db{font-size:11px;color:#888;margin-top:2px}
.dept-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dept-btn{background:white;border:1.5px solid #ccc;border-radius:8px;padding:12px 8px;cursor:pointer;font-size:13px;color:#1F3864;text-align:center;transition:all .15s;line-height:1.4}
.dept-btn:hover{border-color:#2E75B6;background:#EBF4FA}
.proc-item{background:white;border:1.5px solid #ddd;border-radius:8px;padding:11px 14px;margin-bottom:7px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:all .15s}

.rbadge{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:bold;white-space:nowrap}

.risk-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.12);transform:translateY(-1px)}
.risk-card-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;font-weight:bold}
.risk-card-title{font-size:15px}

.gh-low{border-left-color:#2E7D32}

.yn-no{border-color:#2E7D32!important;background:#E8F5E9!important;color:#2E7D32}
.yn-btn:hover{border-color:#2E75B6}

.a-hold{background:#FFEBEE;color:#C62828;border:1px solid #EF9A9A}

  '機械弁置換術後の血栓塞栓症の既往',
  '抗リン脂質抗体症候群',
  '深部静脈血栓症・肺塞栓症（発症3ヵ月以内）',
  '重症血栓性素因（プロテインC/S欠乏、抗トロンビンIII欠乏等）',
];

// DOAC用量区分（2026年版区域麻酔ガイドライン 表11）
const DOSE_INFO={
  dabi:{low:'110mg × 2回/日',std:'150mg × 2回/日'},
  riva:{low:'10mg × 1回/日',std:'15〜20mg × 1〜2回/日'},
  apix:{low:'2.5mg × 2回/日',std:'5〜10mg × 2回/日'},
  edox:{low:'15mg × 1回/日',std:'30〜60mg × 1回/日'},
};

let S={step:'drug',drugs:[],deptIdx:null,procIdx:null,extra:{tap:null,tac:null,crcl:null,dose:null,plt:null}};

const deptNames=Object.keys(DEPTS);
function getDept(){return deptNames[S.deptIdx];}
function getProc(){return DEPTS[getDept()][S.procIdx];}
function hasDT(t){return S.drugs.some(id=>DRUGS.find(x=>x.id===id)?.type===t);}
function hasP2Y12(){return hasDT('P2Y12');}
function hasASA(){return hasDT('ASA');}
function hasVKA(){return hasDT('VKA');}
function hasCIL(){return hasDT('CIL');}
function hasDOAC(){return hasDT('DABI')||hasDT('XA');}
function hasAntiplatelet(){return hasASA()||hasP2Y12()||hasCIL();}
function countAP(){let n=0;if(hasASA())n++;if(hasP2Y12())n++;if(hasCIL())n++;return n;}

function getQs(){
  if(!S.procIdx===null&&!S.deptIdx===null) return [];
  const p=getProc();if(!p)return [];
  const r=p.risk,sp=p.sp||'';
  const qs=[];
  if(r==='excluded') return qs;

  // 区域麻酔（中リスク以上）：2026年版GL準拠。用量区分・血小板数を確認
  if(r==='anest_mid'){
    qs.push('plt');                                   // 高リスク判定（血小板<10万・凝固異常）
    if((hasP2Y12()||hasCIL())) qs.push('tap');
    if(hasDOAC()) qs.push('dose');                    // 用量別基準（CrClではない）
    if(hasDT('DABI')) qs.push('crcl');                // ダビガトランのみ腎機能も確認
    return [...new Set(qs)];
  }

  // 区域麻酔（低リスク＝体表面ブロック）：手術・高出血リスク処置と同じ基準を適用
  if(r==='anest_low'){
    if(hasP2Y12()||hasCIL()) qs.push('tap');
    if(hasVKA()) qs.push('tac');
    if(hasDOAC()) qs.push('crcl');
    return [...new Set(qs)];
  }

  if(r==='low'){
    if(sp==='lp'){
      if(hasDOAC()) qs.push('dose');                  // 腰椎穿刺は区域麻酔中リスクに準拠
      if(hasDT('DABI')) qs.push('crcl');
      return [...new Set(qs)];
    }
    // 消化器内視鏡以外の低リスク手技では、ダビガトランの休薬期間がCrClで変わる
    // （CrCl≥50：24時間前／CrCl 30-49：48時間前／CrCl<30：禁忌）
    if(sp!=='gi'&&hasDT('DABI')) qs.push('crcl');
    return [...new Set(qs)];
  }
  if(r==='high'){
    if((hasP2Y12()||hasCIL())&&sp!=='pacemaker') qs.push('tap');
    if(hasVKA()&&sp!=='pacemaker') qs.push('tac');
    if(hasDT('DABI')) qs.push('crcl');
    if(hasDT('XA')) qs.push('crcl');
  }
  // deduplicate
  return [...new Set(qs)];
}

function allAnswered(){
  return getQs().every(q=>S.extra[q]!==null);
}

function drugRec(id){
  const drug=DRUGS.find(d=>d.id===id);
  const p=getProc();
  const r=p.risk,sp=p.sp||'';
  const gi=sp==='gi',pacer=sp==='pacemaker',lp=sp==='lp',dental=sp==='dental';
  const anestMid=r==='anest_mid'||lp;   // 腰椎穿刺は区域麻酔中リスクに準拠
  const anestLow=r==='anest_low';
  const tap=S.extra.tap,tac=S.extra.tac,crcl=S.extra.crcl,dose=S.extra.dose;
  // 適用除外手技は専門プロトコルに従うため、本アルゴリズムでは判定しない
  if(r==='excluded') return null;
  // 体表面ブロック（低リスク）は「手術・高出血リスク処置」の基準を適用（2026年版GL）
  const asHigh=(r==='high'||anestLow);

  if(drug.type==='ASA'){
    if(r==='low'&&!lp) return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'低出血リスク手技のため休薬不要。'};
    if(anestMid) return{badge:'低用量は継続',cls:'a-cont',hold:'低用量（<200mg/日）：休薬不要\n高用量（≧200mg/日）：3〜7日前',restart:'低用量：―\n高用量：カテーテル抜去後 6時間',note:'【2026年版区域麻酔GL 表9】低用量アスピリン（<200mg/日）を含むNSAIDsは、脊髄幹麻酔・深部の神経ブロックにおいても休薬は必須ではない。\n虚血性心疾患・脳血管障害に用いる81〜100mg/日は低用量に分類される（当院採用のバイアスピリンは100mg）。\n※200mg/日以上を服用中の場合のみ、3〜7日前の休薬が必要です。処方内容をご確認ください。'};
    if(pacer) return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'ペースメーカー・ICD植込み術では継続可（AHA/ACC 2023）。'};
    return{badge:'原則継続',cls:'a-cont',hold:'通常休薬不要。必要な場合のみ3〜7日前',restart:'手術翌日（止血確認後）',note:'高出血リスク手技でもASA単剤は原則継続。虚血リスクが出血リスクを上回るため。'};
  }

  if(drug.type==='P2Y12'){
    if(r==='low'&&!lp) return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'低出血リスク手技のため継続。'};
    if(pacer) return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'ペースメーカー・ICD植込み術では継続可（AHA/ACC 2023）。'};
    if(anestMid){
      if(tap===true) return{badge:'処方科と協議',cls:'a-cons',hold:'原則継続（中止は処方科必須）',restart:'手術翌日',note:'高血栓リスク群。必ず処方科（循環器内科等）と協議してください。'};
      // 2026年版区域麻酔GL 表9（脊髄幹麻酔・深部の神経ブロック）
      let h='',rs='',nt='【2026年版区域麻酔GL 表9】脊髄幹麻酔・深部の神経ブロックにおける基準です。';
      if(id==='clopi'){      h='7日前'; rs='カテーテル抜去後 0時間（抜去直後から再開可）'; }
      else if(id==='prasu'){ h='7日前'; rs='カテーテル抜去後 24時間'; }
      else if(id==='tica'){  h='5日前'; rs='カテーテル抜去後 24時間'; }
      else if(id==='tilo'){  h='10〜14日前'; rs='カテーテル抜去後 24時間';
        nt='チクロピジンは2026年版区域麻酔GL 表9に記載がないため、手術・処置の基準（10〜14日前）を適用しています。個別に処方科・麻酔科と協議してください。'; }
      if(id==='clopi'||id==='prasu') nt+='\n※血小板数が基準値にあり、血小板機能検査等が利用可能な環境では5日間への短縮も許容されます（GL p.38）。麻酔科と協議のうえ判断してください。';
      return{badge:'休薬',cls:'a-hold',hold:h,restart:rs,note:nt};
    }
    if(tap===true) return{badge:'処方科と協議',cls:'a-cons',hold:'原則継続（中止は処方科必須）',restart:'手術翌日',note:'高血栓リスク群のため原則継続。中止の場合は必ず処方科（循環器内科等）と協議すること。消化器内視鏡ではASA・シロスタゾールへの一時変更も選択肢（JGES 2017）。'};
    let hold='';
    if(gi){
      if(id==='clopi'||id==='prasu'||id==='tica'||id==='tilo') hold='5日前（JGES 2017最短休薬期間）';
    } else {
      if(id==='clopi') hold='5〜7日前';
      else if(id==='prasu') hold='7〜14日前（JCS 2020：7日前、添付文書：14日前）\n※高血栓リスク例では最短7日前を処方科と個別検討';
      else if(id==='tica') hold='3〜5日前（JCS 2020：3日前、ACC/AHA 2024：5日前）';
      else if(id==='tilo') hold='10〜14日前';
    }
    return{badge:'休薬',cls:'a-hold',hold,restart:'手術翌日（止血確認後）',note:gi?'JGES 2017：学会ガイドラインが院内マニュアルに優先されます（基本原則⑤）。':null};
  }

  if(drug.type==='CIL'){
    if(r==='low'&&!lp) return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'低出血リスク手技のため継続。'};
    const hold=gi?'1日前（JGES 2017最短）':'2〜3日前';
    if(tap===true) return{badge:'処方科と協議',cls:'a-cons',hold:'2〜3日前（処方科と協議の上決定）',restart:'手術翌日',note:'高血栓リスクの場合は処方科と協議すること。'};
    if(anestMid) return{badge:'原則継続',cls:'a-cont',hold:'休薬は必須ではない\n（休薬が適当と判断される場合：2日前）',restart:'手術翌日（止血確認後）',note:'【2026年版区域麻酔GL】シロスタゾールは休薬を支持するエビデンスがないため、脊髄幹麻酔・深部の神経ブロックの実施前の休薬は必須ではない（表9に休薬日数の提案なし）。\n出血リスクが高いと判断され休薬が適当な症例では、2日間の休薬期間を目安とする。'};
    return{badge:'休薬',cls:'a-hold',hold,restart:'手術翌日（止血確認後）',note:null};
  }

  if(drug.type==='VKA'){
    if(pacer) return{badge:'継続を推奨',cls:'a-cont',hold:null,restart:null,note:'【重要】ペースメーカー・ICD植込み術ではワルファリン継続投与が推奨される（AHA/ACC 2023 Class I、BRUISE CONTROL試験）。ブリッジング療法は出血リスクを増加させるため行わないこと。DOAC服用患者は術前24〜48時間の休薬が目安。'};
    if(r==='low'&&!lp){
      if(gi) return{badge:'継続（INR<3.0確認）',cls:'a-cont',hold:null,restart:null,note:'消化器内視鏡低出血リスク手技：INR<3.0であれば継続下で施行可（JGES 2017）。INR≥3.0の場合は処方科に連絡。DOACへの一時変更も選択肢。'};
      return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'低出血リスク手技のため休薬不要。術前PT-INR測定を行い、INR>3.0の場合は処方科に連絡。'};
    }
    if(anestMid){
      return{badge:'休薬',cls:'a-hold',hold:'5日前に中止。ブロック前にPT-INR ≤ 1.2 を確認',restart:'カテーテル抜去後 0時間（抜去直後から再開可）',note:'【2026年版区域麻酔GL 表9】休薬期間は5日間（ビタミンK依存性凝固因子の活性が正常域に復帰する期間）。\nブロック実施前およびカテーテル抜去前にPT-INR ≤ 1.2 であることを確認することが望ましい。\n※前版（2016年）の基準 INR≤1.5 から変更されています。\n術後の初回投与は穿刺から12時間以上後。'+(lp?'\n腰椎穿刺ではINR<1.4を目安とすることが望ましい（Pract Neurol 2018）。':'')};
    }
    if(tac===true){
      return{badge:'休薬＋ブリッジング考慮',cls:'a-cons',hold:'3〜5日前（INR<1.5まで）',restart:'手術翌日からワルファリン再開。INR治療域回復後ヘパリン中止。',note:'血栓塞栓症高リスク群。必ず処方科と協議の上ブリッジング療法を検討。\n①ワルファリン中止3〜5日前（INR<1.5まで）\n②UFH静注（術前6〜12時間前中止）またはLMWH（術前24時間前中止）\n③手術翌日からワルファリン再開'};
    }
    const note=gi?'ブリッジング療法は原則不要（BRIDGE試験2015）。DOACへの一時変更も選択肢（JGES 2017）。':'ブリッジング療法は原則不要（BRIDGE試験2015）。';
    return{badge:'休薬',cls:'a-hold',hold:'3〜5日前（手技前日にINR<1.5確認）',restart:'手術翌日（止血確認後）',note};
  }

  if(drug.type==='DABI'){
    // 区域麻酔（中リスク以上）／腰椎穿刺：2026年版GL 表9 = 用量別基準
    if(anestMid){
      if(!dose) return{badge:'要用量確認',cls:'a-cons',hold:'DOACの用量区分の入力が必要です',restart:'',note:null};
      if(crcl==='lt30') return{badge:'禁忌',cls:'a-cons',hold:'CrCl<30：本剤は禁忌',restart:'処方科・薬剤部に相談',note:'ダビガトランはCrCl<30で禁忌。区域麻酔の中止も検討すること。'};
      const h=dose==='low'?'48時間前に最終服用（低用量）':'72時間前に最終服用（標準用量）';
      const rs=dose==='low'?'カテーテル抜去後 6時間':'カテーテル抜去後 24時間';
      const warn=crcl==='30to49'?'\n【注意】CrCl 30〜49 では薬物排泄遅延を考慮し、休薬期間の72時間への延長や区域麻酔の中止を検討すること。':'';
      return{badge:'休薬',cls:'a-hold',hold:h,restart:rs,note:'【2026年版区域麻酔GL 表9】休薬期間は腎機能ではなく用量区分で決定します。'+warn+'\n可能であれば残存DOAC濃度（<30 ng/mL）を測定し参考にする。'};
    }
    if(r==='low'){
      if(gi) return{badge:'当日朝スキップ',cls:'a-hold',hold:'当日朝1回スキップのみ（JGES 2017）',restart:'次回より通常通り内服',note:null};
      if(!crcl) return{badge:'要CrCl確認',cls:'a-cons',hold:'CrClの入力が必要です',restart:'',note:null};
      const h=crcl==='lt30'?'禁忌（CrCl<30）。処方科に相談':crcl==='30to49'?'2日（48時間）前に中止':'1日（24時間）前に中止（PAUSE試験）';
      return{badge:'休薬',cls:'a-hold',hold:h,restart:'手技翌日（止血確認後）',note:'CrCl<30は禁忌。'};
    }
    // high risk
    if(!crcl) return{badge:'要CrCl確認',cls:'a-cons',hold:'CrClの入力が必要です',restart:'',note:null};
    if(crcl==='lt30') return{badge:'禁忌',cls:'a-cons',hold:'CrCl<30：本剤は禁忌',restart:'処方科・薬剤部に相談',note:'ダビガトランはCrCl<30で禁忌。代替薬を処方科と協議すること。'};
    const h2=crcl==='30to49'?'4日（96時間）前に最終服用':'3日（72時間）前に最終服用';
    const r2=crcl==='30to49'?'処方科と相談の上決定':'止血確認後6〜8時間（低リスク）／24〜48時間（高リスク）';
    return{badge:'休薬',cls:'a-hold',hold:h2,restart:r2,note:'DOACにブリッジング療法は不要。緊急中和薬：イダルシズマブ（プリズバインド®）5g IV（RE-VERSE AD試験）。'};
  }

  if(drug.type==='XA'){
    const xn=id==='riva'?'リバーロキサバン':id==='apix'?'アピキサバン':'エドキサバン';
    // 区域麻酔（中リスク以上）／腰椎穿刺：2026年版GL 表9 = 用量別基準
    if(anestMid){
      if(!dose) return{badge:'要用量確認',cls:'a-cons',hold:'DOACの用量区分の入力が必要です',restart:'',note:null};
      const h=dose==='low'?'24時間前に最終服用（低用量）':'72時間前に最終服用（標準・高用量）';
      const rs=dose==='low'?'カテーテル抜去後 6時間':'カテーテル抜去後 24時間';
      const lim=id==='edox'?'CrCl<30':'CrCl<15';
      return{badge:'休薬',cls:'a-hold',hold:h,restart:rs,note:`【2026年版区域麻酔GL 表9】休薬期間は腎機能ではなく用量区分で決定します。\n【腎機能低下例の注意】${xn}は${lim}で薬物排泄遅延を考慮し、休薬期間の72時間への延長や区域麻酔の中止を検討すること。\n可能であれば抗Xa活性（≦0.1 IU/mL）を測定し参考にする。`};
    }
    if(r==='low'){
      if(gi) return{badge:'当日朝スキップ',cls:'a-hold',hold:'当日朝1回スキップのみ（JGES 2017）',restart:'次回より通常通り内服',note:null};
      return{badge:'1日前',cls:'a-hold',hold:'1日（24時間）前に中止（PAUSE試験）',restart:'手技翌日（止血確認後）',note:null};
    }
    // high risk - need CrCl
    if(!crcl) return{badge:'要CrCl確認',cls:'a-cons',hold:'CrClの入力が必要です',restart:'',note:null};
    if(crcl==='lt30') return{badge:'原則禁忌',cls:'a-cons',hold:'CrCl<15で各薬剤禁忌。CrCl 15-29は原則適応外',restart:'処方科・薬剤部に相談',note:`${xn}：CrCl<15で禁忌。CrCl 15-29は原則適応外。使用中は処方科に必ず相談。`};
    if(crcl==='30to49') return{badge:'休薬（要相談）',cls:'a-cons',hold:'3日（72時間）前に最終服用（処方科と相談）',restart:'処方科と相談の上決定',note:`CrCl 15〜29の場合は原則適応外。処方科必須。CrCl 30〜49の場合は通常の3日前中止で可。`};
    return{badge:'休薬',cls:'a-hold',hold:'3日（72時間）前に最終服用（PAUSE試験）',restart:'止血確認後6〜8時間（低リスク）／24〜48時間（高リスク）',note:'DOACにブリッジング療法は不要。緊急中和薬：アンデキサネット アルファ（オンデキサ®）または4-PCC。'};
  }
  return null;
}

function hdr(step){
  const steps=['drug','dept','proc','extra','result'];
  const pct=(steps.indexOf(step)+1)/steps.length*100;
  return`<div class="header"><h1>抗血栓薬 取り扱いガイド</h1><small>神戸市立医療センター中央市民病院　医療安全管理室</small></div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>`;
}

function renderDrug(){
  const groups=[
    {label:'抗血小板薬（COX阻害）',ids:['asa']},
    {label:'抗血小板薬（P2Y12阻害）',ids:['clopi','prasu','tica','tilo']},
    {label:'抗血小板薬（PDE3阻害）',ids:['cilo']},
    {label:'抗凝固薬（VKA）',ids:['warf']},
    {label:'DOAC',ids:['dabi','riva','apix','edox']},
  ];
  let h=hdr('drug')+'<div class="content"><div class="step-title">STEP 1 / 4</div><div class="step-q">服用中の抗血栓薬を選んでください</div><div style="font-size:12px;color:#888;margin-bottom:4px">複数選択できます（DAPTなど）</div>';
  for(const g of groups){
    h+=`<div class="sub-label">${g.label}</div><div class="drug-grid">`;
    for(const id of g.ids){
      const d=DRUGS.find(x=>x.id===id);
      const sel=S.drugs.includes(id)?' sel':'';
      h+=`<div class="drug-item${sel}" onclick="toggleDrug('${id}')"><div class="dn">${d.name}</div><div class="db">${d.brand}</div></div>`;
    }
    h+='</div>';
  }
  const ok=S.drugs.length>0;
  h+=`<button class="btn btn-p" onclick="go('dept')" ${ok?'':'disabled'}>次へ：実施する手技を選択 →</button></div>`;
  return h;
}

function renderDept(){
  let h=hdr('dept')+'<div class="content"><div class="step-title">STEP 2 / 4</div><div class="step-q">実施する手技の診療科を選んでください</div><div class="dept-grid">';
  deptNames.forEach((d,i)=>{h+=`<button class="dept-btn" onclick="selDept(${i})">${d}</button>`;});
  h+=`</div><button class="btn btn-back" onclick="go('drug')">← 戻る</button></div>`;
  return h;
}

// リスク区分＋特例ルール（sp）の組み合わせごとにグループを作る。
// 同じリスクでも特例ルールが違うものは別グループにしないと誤判定になるため。
function buildGroups(){
  const procs=DEPTS[getDept()];
  const map=new Map();
  procs.forEach((p,i)=>{
    const sp=p.sp||'';
    // 適用除外は手技ごとに理由が異なるため個別に
    const key=p.risk==='excluded'?('excluded#'+i):(p.risk+'#'+sp);
    if(!map.has(key)) map.set(key,{risk:p.risk,sp,idx:i,names:[]});
    map.get(key).names.push(p.name);
  });

  const LABELS={
    'high#':          {t:'高出血リスク',                    c:'gh-high',o:1},
    'high#gi':        {t:'高出血リスク（消化器内視鏡）',      c:'gh-high',o:2},
    'high#pacemaker': {t:'ペースメーカー・ICD植込み術',      c:'gh-high',o:3},
    'anest_mid#':     {t:'区域麻酔（中リスク・深部ブロック）',c:'gh-mid', o:4},
    'low#':           {t:'低出血リスク',                    c:'gh-low', o:5},
    'low#gi':         {t:'低出血リスク（消化器内視鏡）',      c:'gh-low', o:6},
    'low#lp':         {t:'腰椎穿刺・髄液検査',               c:'gh-mid', o:7},
    'low#dental':     {t:'抜歯（普通・埋伏）',               c:'gh-low', o:8},
    'anest_low#':     {t:'区域麻酔（低リスク・体表面ブロック）',c:'gh-low',o:9},
  };

  const out=[];
  for(const [key,g] of map){
    if(g.risk==='excluded'){
      out.push({...g,label:'本マニュアル適用除外',cls:'gh-excl',order:99});
    }else{
      const L=LABELS[g.risk+'#'+g.sp]||{t:g.risk,c:'gh-low',o:50};
      out.push({...g,label:L.t,cls:L.c,order:L.o});
    }
  }
  return out.sort((a,b)=>a.order-b.order);
}

function renderProc(){
  let h=hdr('proc')+`<div class="content"><div class="step-title">STEP 3 / 4</div><div class="step-q">${getDept()}の出血リスク区分を選んでください</div><div style="font-size:12px;color:#888;margin-bottom:10px">各区分の下に該当手技を示しています</div>`;

  for(const g of buildGroups()){
    h+=`<div class="risk-card ${g.cls}" onclick="selProc(${g.idx})">`
      +`<div class="risk-card-head"><span class="risk-card-title">${g.label}</span><span class="chev">›</span></div>`
      +`<div class="risk-card-list">${g.names.join('　／　')}</div>`
      +`</div>`;
  }

  h+=`<button class="btn btn-back" onclick="go('dept')">← 戻る</button></div>`;
  return h;
}

function renderExtra(){
  const qs=getQs();
  let h=hdr('extra')+'<div class="content"><div class="step-title">STEP 4 / 4</div><div class="step-q">追加情報を入力してください</div>';

  if(qs.includes('tap')){
    const s=S.extra.tap;
    h+=`<div class="extra-card"><div class="extra-title">【抗血小板薬】血栓塞栓症 高リスク群に該当しますか？</div><ul class="criteria">${AP_CRITERIA.map(c=>`<li>${c}</li>`).join('')}</ul><div class="yn-grid"><button class="yn-btn${s===true?' yn-yes':''}" onclick="setE('tap',true)">⚠️ いずれかに該当（高リスク）</button><button class="yn-btn${s===false?' yn-no':''}" onclick="setE('tap',false)">✓ 該当なし（低リスク）</button></div></div>`;
  }
  if(qs.includes('tac')){
    const s=S.extra.tac;
    h+=`<div class="extra-card"><div class="extra-title">【抗凝固薬】血栓塞栓症 高リスク群に該当しますか？</div><ul class="criteria">${AC_CRITERIA.map(c=>`<li>${c}</li>`).join('')}</ul><div class="yn-grid"><button class="yn-btn${s===true?' yn-yes':''}" onclick="setE('tac',true)">⚠️ いずれかに該当（高リスク）</button><button class="yn-btn${s===false?' yn-no':''}" onclick="setE('tac',false)">✓ 該当なし（低リスク）</button></div></div>`;
  }
  if(qs.includes('plt')){
    const s=S.extra.plt;
    h+=`<div class="extra-card"><div class="extra-title">血小板減少・凝固異常はありますか？<br><span style="font-size:12px;font-weight:normal;color:#888">血小板 &lt; 10万/μL、または重篤な肝障害・凝固因子欠乏等</span></div><div class="yn-grid"><button class="yn-btn${s===true?' yn-yes':''}" onclick="setE('plt',true)">⚠️ あり（高リスク）</button><button class="yn-btn${s===false?' yn-no':''}" onclick="setE('plt',false)">✓ なし</button></div></div>`;
  }
  if(qs.includes('dose')){
    const s=S.extra.dose;
    const doacIds=S.drugs.filter(id=>['dabi','riva','apix','edox'].includes(id));
    let lowList='',stdList='';
    for(const id of doacIds){
      const d=DRUGS.find(x=>x.id===id);
      lowList+=`<div style="font-size:11px;color:#555">${d.name}：${DOSE_INFO[id].low}</div>`;
      stdList+=`<div style="font-size:11px;color:#555">${d.name}：${DOSE_INFO[id].std}</div>`;
    }
    h+=`<div class="extra-card"><div class="extra-title">DOACの用量区分を選んでください<br><span style="font-size:12px;font-weight:normal;color:#888">2026年版区域麻酔ガイドライン 表11。実際の処方内容で確認してください。</span></div><div class="crcl-grid" style="grid-template-columns:1fr"><button class="crcl-btn${s==='low'?' crcl-sel':''}" style="text-align:left" onclick="setE('dose','low')"><div style="margin-bottom:4px">低用量（予防的用量）</div>${lowList}</button><button class="crcl-btn${s==='std'?' crcl-sel':''}" style="text-align:left" onclick="setE('dose','std')"><div style="margin-bottom:4px">標準・高用量（治療的用量）</div>${stdList}</button></div></div>`;
  }
  if(qs.includes('crcl')){
    const s=S.extra.crcl;
    h+=`<div class="extra-card"><div class="extra-title">腎機能（CrCl）を選んでください<br><span style="font-size:12px;font-weight:normal;color:#888">Cockcroft-Gault式で計算。術前直近の値を使用。</span></div><div class="crcl-grid"><button class="crcl-btn${s==='lt30'?' crcl-sel':''}" onclick="setE('crcl','lt30')">CrCl &lt; 30 mL/min</button><button class="crcl-btn${s==='30to49'?' crcl-sel':''}" onclick="setE('crcl','30to49')">CrCl 30〜49 mL/min</button><button class="crcl-btn${s==='50to79'?' crcl-sel':''}" onclick="setE('crcl','50to79')">CrCl 50〜79 mL/min</button><button class="crcl-btn${s==='gte80'?' crcl-sel':''}" onclick="setE('crcl','gte80')">CrCl ≥ 80 mL/min</button></div></div>`;
  }

  const ok=allAnswered();
  h+=`<button class="btn btn-p" onclick="go('result')" ${ok?'':'disabled'}>推奨を表示 →</button><button class="btn btn-back" onclick="go('proc')">← 戻る</button></div>`;
  return h;
}

function renderResult(){
  const p=getProc();
  const isPacer=p.sp==='pacemaker';
  const isGI=p.sp==='gi';
  const isDental=p.sp==='dental';
  const isExcluded=p.risk==='excluded';
  const apIds=S.drugs.filter(id=>['asa','clopi','prasu','tica','tilo'].includes(id));
  const isDAPT=apIds.length>=2;
  const isTriple=S.drugs.some(id=>['warf','dabi','riva','apix','edox'].includes(id))&&isDAPT;
  const isAnestMid=p.risk==='anest_mid';
  const isAnestLow=p.risk==='anest_low';
  const isLP=p.sp==='lp';
  let riskText=p.risk==='excluded'?'本マニュアル適用除外':p.risk==='low'?'低出血リスク':p.risk==='high'?'高出血リスク':p.risk==='anest_low'?'区域麻酔（低リスク・体表面）':'区域麻酔（中リスク・深部）';

  // 選択したリスク区分のラベルを取得（手技名ではなく区分名で表示）
  const grp=buildGroups().find(g=>g.idx===S.procIdx)||{label:riskText,names:[p.name]};

  let h=hdr('result')+`<div class="content"><div class="sec-header"><h2>推奨結果</h2><p>${getDept()}｜${grp.label}</p></div>`;

  // 区域麻酔・高リスク（血小板減少/凝固異常）→ 原則禁忌
  if(isAnestMid&&S.extra.plt===true){
    h+=`<div class="warn-box"><strong>⛔ 当該区域麻酔手技は原則禁忌です</strong>血小板 &lt; 10万/μL または凝固異常のある患者に中リスク手技を行う場合、区域麻酔（高リスク）に分類され原則禁忌となります（2026年版ガイドライン 総論5章）。<br><br>麻酔科と協議し、<b>全身麻酔等の代替麻酔法への変更を検討</b>してください。手術自体は代替麻酔法で施行可能です。</div>`;
    h+=`<div class="contact"><strong>相談先</strong>麻酔科<br>処方科（循環器内科・脳神経内科等）<br>医療安全管理室（内線 3311）</div>`;
    h+=`<button class="btn btn-back" onclick="go('extra')">← 前の画面に戻る</button>`;
    h+=`<button class="new-btn" onclick="reset()">最初からやり直す</button>`;
    h+=`<div class="foot">本ガイドは院内マニュアル（2026年8月25日改訂版）に基づきます。<br>個々の症例では担当科・処方科の判断を優先してください。</div></div>`;
    return h;
  }

  if(isExcluded){
    h+=`<div class="warn-box"><strong>⚠️ 本マニュアルの一般原則は適用されません</strong>${p.excludeNote}</div>`;
    h+=`<div class="contact"><strong>相談先</strong>処方科（循環器内科・脳神経内科・脳神経外科等）の専門プロトコルに従ってください。<br>不明な点は医療安全管理室（内線 3311）へ。</div>`;
    h+=`<button class="btn btn-back" onclick="go('proc')">← 前の画面に戻る</button>`;
    h+=`<button class="new-btn" onclick="reset()">最初からやり直す</button>`;
    h+=`<div class="foot">本ガイドは院内マニュアル（第3.1版・2026年9月6日改訂）に基づきます。<br>個々の症例では担当科・処方科の判断を優先してください。</div></div>`;
    return h;
  }

  if(isTriple) h+=`<div class="warn-box"><strong>⚠️ 三剤併用（抗凝固薬＋DAPT）</strong>出血リスクが著しく上昇します。処方科と十分協議の上、個別に出血リスクと血栓リスクを評価してください。</div>`;
  else if(isDAPT) h+=`<div class="warn-box"><strong>⚠️ DAPT（二剤併用抗血小板療法）</strong>単剤中止の可否も含め、必ず循環器内科等の処方科と協議してください。</div>`;
  if(isAnestMid) h+=`<div class="info-box"><strong>ℹ️ 区域麻酔（中リスク・深部ブロック）</strong>2026年7月改訂『抗血栓療法中の区域麻酔・神経ブロックガイドライン 改訂第2版』に準拠します。<br>DOACの休薬期間は<b>腎機能ではなく用量区分</b>で決定します。ワルファリンは<b>PT-INR ≤ 1.2</b>を確認してください（前版の1.5から変更）。</div>`;
  if(isAnestLow) h+=`<div class="info-box"><strong>ℹ️ 区域麻酔（低リスク・体表面ブロック）</strong>体表面の神経ブロックは、手術・高出血リスク処置と同じ休薬期間を適用します（2026年版ガイドライン）。</div>`;
  if(isLP) h+=`<div class="info-box"><strong>ℹ️ 腰椎穿刺</strong>硬膜穿刺を伴う手技のため、DOAC・ワルファリン服用患者は<b>区域麻酔（中リスク以上）に準じた管理</b>を行います。</div>`;
  if(isGI) h+=`<div class="info-box"><strong>ℹ️ 消化器内視鏡（JGES 2017適用）</strong>一般的な手術・処置基準とは異なるルールが適用されます。</div>`;
  if(isPacer) h+=`<div class="info-box"><strong>ℹ️ ペースメーカー・ICD植込み術</strong>ワルファリン継続が推奨されます（AHA/ACC 2023 Class I）。ブリッジング療法は出血リスクを増加させるため施行しないこと。</div>`;

  for(const id of S.drugs){
    const drug=DRUGS.find(d=>d.id===id);
    const rec=drugRec(id);
    if(!rec)continue;
    h+=`<div class="result-card"><div class="rdrug">${drug.name}<span class="abadge ${rec.cls}">${rec.badge}</span></div><div style="font-size:11px;color:#aaa;margin-bottom:10px">${drug.brand}</div>`;
    if(rec.hold) h+=`<div class="rrow"><div class="rlabel">🗓 休薬開始</div><div class="rval">${rec.hold}</div></div>`;
    if(rec.restart) h+=`<div class="rrow"><div class="rlabel">✅ 再開時期</div><div class="rval">${rec.restart}</div></div>`;
    if(rec.note) h+=`<div class="rnotes">${rec.note}</div>`;
    h+=`</div>`;
  }

  if(isDental) h+=`<div class="info-box"><strong>ℹ️ 抜歯に関する特記事項（2025年版ガイドライン）</strong>抗凝固薬単剤服用患者の普通抜歯は原則継続のまま施行可（適切な局所止血処置を行うこと）。多剤併用患者は処方科と個別協議が必須。</div>`;

  h+=`<div class="contact"><strong>不明な点がある場合の相談先</strong>処方科（循環器内科・脳神経内科・血液内科等）<br>薬剤部（薬剤師による相談）<br>医療安全管理室（内線 3311）</div>`;
  const backStep=getQs().length>0?'extra':'proc';
  h+=`<button class="btn btn-back" onclick="go('${backStep}')">← 前の画面に戻る</button>`;
  h+=`<button class="new-btn" onclick="reset()">最初からやり直す</button>`;
  h+=`<div class="foot">本ガイドは院内マニュアル（第3.1版・2026年9月6日改訂）に基づきます。<br>個々の症例では担当科・処方科の判断を優先してください。</div></div>`;
  return h;
}

function render(){
  const a=document.getElementById('app');
  if(S.step==='drug') a.innerHTML=renderDrug();
  else if(S.step==='dept') a.innerHTML=renderDept();
  else if(S.step==='proc') a.innerHTML=renderProc();
  else if(S.step==='extra') a.innerHTML=renderExtra();
  else a.innerHTML=renderResult();
}

function toggleDrug(id){
  S.drugs=S.drugs.includes(id)?S.drugs.filter(x=>x!==id):[...S.drugs,id];
  render();
}
function go(step){S.step=step;render();window.scrollTo(0,0);}
function selDept(i){S.deptIdx=i;S.procIdx=null;S.extra={tap:null,tac:null,crcl:null,dose:null,plt:null};go('proc');}
function selProc(i){
  S.procIdx=i;
  S.extra={tap:null,tac:null,crcl:null,dose:null,plt:null};
  go(getQs().length>0?'extra':'result');
}
function setE(k,v){S.extra[k]=v;render();}
function reset(){S={step:'drug',drugs:[],deptIdx:null,procIdx:null,extra:{tap:null,tac:null,crcl:null,dose:null,plt:null}};render();window.scrollTo(0,0);}

render();
</script>
