];

let S={step:'drug',drugs:[],deptIdx:null,procIdx:null,extra:{tap:null,tac:null,crcl:null}};

const deptNames=Object.keys(DEPTS);
function getDept(){return deptNames[S.deptIdx];}
function getProc(){return DEPTS[getDept()][S.procIdx];}
function hasDT(t){return S.drugs.some(id=>DRUGS.find(x=>x.id===id)?.type===t);}
function hasP2Y12(){return hasDT('P2Y12');}
function hasASA(){return hasDT('ASA');}
function hasVKA(){return hasDT('VKA');}
function hasCIL(){return hasDT('CIL');}
function hasDOAC(){return hasDT('DABI')||hasDT('XA');}
function hasAntiplatelet(){return hasASA()||hasP2Y12()||hasCIL();}
function countAP(){let n=0;if(hasASA())n++;if(hasP2Y12())n++;if(hasCIL())n++;return n;}

function getQs(){
  if(!S.procIdx===null&&!S.deptIdx===null) return [];
  const p=getProc();if(!p)return [];
  const r=p.risk,sp=p.sp||'';
  const qs=[];
  if(r==='excluded') return qs;
  if(r==='low'){
    if(sp==='lp'&&hasDT('DABI')) qs.push('crcl');
    return qs;
  }
  if(r==='high'||r==='anest'){
    if((hasP2Y12()||hasCIL())&&sp!=='pacemaker') qs.push('tap');
    if(hasVKA()&&sp!=='pacemaker') qs.push('tac');
    if(hasDT('DABI')) qs.push('crcl');
    if(hasDT('XA')&&r==='high') qs.push('crcl');
  }
  // deduplicate
  return [...new Set(qs)];
}

function allAnswered(){
  return getQs().every(q=>S.extra[q]!==null);
}

function drugRec(id){
  const drug=DRUGS.find(d=>d.id===id);
  const p=getProc();
  const r=p.risk,sp=p.sp||'';
  const gi=sp==='gi',pacer=sp==='pacemaker',lp=sp==='lp',anest=r==='anest',dental=sp==='dental';
  const tap=S.extra.tap,tac=S.extra.tac,crcl=S.extra.crcl;

  if(drug.type==='ASA'){
    if(r==='low') return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'低出血リスク手技のため休薬不要。'};
    if(anest) return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'アスピリン単剤は区域麻酔に対して休薬不要（2016年日本GL）。'};
    if(pacer) return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'ペースメーカー・ICD植込み術では継続可（AHA/ACC 2023）。'};
    return{badge:'原則継続',cls:'a-cont',hold:'通常休薬不要。必要な場合のみ3〜7日前',restart:'手術翌日（止血確認後）',note:'高出血リスク手技でもASA単剤は原則継続。虚血リスクが出血リスクを上回るため。'};
  }

  if(drug.type==='P2Y12'){
    if(r==='low') return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'低出血リスク手技のため継続。'};
    if(pacer) return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'ペースメーカー・ICD植込み術では継続可（AHA/ACC 2023）。'};
    if(anest){
      if(tap===true) return{badge:'処方科と協議',cls:'a-cons',hold:'原則継続（中止は処方科必須）',restart:'手術翌日',note:'高血栓リスク群。必ず処方科（循環器内科等）と協議してください。'};
      let h='';
      if(id==='clopi') h='5〜7日前';
      else if(id==='prasu') h='7〜14日前（JCS 2020：7日前、添付文書：14日前）';
      else if(id==='tica') h='3〜5日前（JCS 2020：3日前、ACC/AHA：5日前）';
      else if(id==='tilo') h='10〜14日前';
      return{badge:'休薬',cls:'a-hold',hold:h,restart:'カテーテル抜去後6時間以上経過後から再開',note:'区域麻酔（中リスク以上のブロック）における管理。2016年日本GL準拠。'};
    }
    if(tap===true) return{badge:'処方科と協議',cls:'a-cons',hold:'原則継続（中止は処方科必須）',restart:'手術翌日',note:'高血栓リスク群のため原則継続。中止の場合は必ず処方科（循環器内科等）と協議すること。消化器内視鏡ではASA・シロスタゾールへの一時変更も選択肢（JGES 2017）。'};
    let hold='';
    if(gi){
      if(id==='clopi'||id==='prasu'||id==='tica'||id==='tilo') hold='5日前（JGES 2017最短休薬期間）';
    } else {
      if(id==='clopi') hold='5〜7日前';
      else if(id==='prasu') hold='7〜14日前（JCS 2020：7日前、添付文書：14日前）\n※高血栓リスク例では最短7日前を処方科と個別検討';
      else if(id==='tica') hold='3〜5日前（JCS 2020：3日前、ACC/AHA 2024：5日前）';
      else if(id==='tilo') hold='10〜14日前';
    }
    return{badge:'休薬',cls:'a-hold',hold,restart:'手術翌日（止血確認後）',note:gi?'JGES 2017：学会ガイドラインが院内マニュアルに優先されます（基本原則⑤）。':null};
  }

  if(drug.type==='CIL'){
    if(r==='low') return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'低出血リスク手技のため継続。'};
    const hold=gi?'1日前（JGES 2017最短）':'2〜3日前';
    if(tap===true) return{badge:'処方科と協議',cls:'a-cons',hold:'2〜3日前（処方科と協議の上決定）',restart:'手術翌日',note:'高血栓リスクの場合は処方科と協議すること。'};
    return{badge:'休薬',cls:'a-hold',hold,restart:'手術翌日（止血確認後）',note:null};
  }

  if(drug.type==='VKA'){
    if(pacer) return{badge:'継続を推奨',cls:'a-cont',hold:null,restart:null,note:'【重要】ペースメーカー・ICD植込み術ではワルファリン継続投与が推奨される（AHA/ACC 2023 Class I、BRUISE CONTROL試験）。ブリッジング療法は出血リスクを増加させるため行わないこと。DOAC服用患者は術前24〜48時間の休薬が目安。'};
    if(r==='low'){
      if(gi) return{badge:'継続（INR<3.0確認）',cls:'a-cont',hold:null,restart:null,note:'消化器内視鏡低出血リスク手技：INR<3.0であれば継続下で施行可（JGES 2017）。INR≥3.0の場合は処方科に連絡。DOACへの一時変更も選択肢。'};
      return{badge:'継続',cls:'a-cont',hold:null,restart:null,note:'低出血リスク手技のため休薬不要。術前PT-INR測定を行い、INR>3.0の場合は処方科に連絡。'};
    }
    if(anest){
      return{badge:'休薬',cls:'a-hold',hold:'3〜5日前中止。手技前日にINR≤1.5確認',restart:'手術翌日からワルファリン再開。INR治療域回復後ヘパリン中止。',note:'区域麻酔（中リスク以上のブロック）：neuraxial麻酔前およびカテーテル抜去前にPT-INR≤1.5確認（2016年日本GL表7）。穿刺から12時間以上後に初回投与。'};
    }
    if(tac===true){
      return{badge:'休薬＋ブリッジング考慮',cls:'a-cons',hold:'3〜5日前（INR<1.5まで）',restart:'手術翌日からワルファリン再開。INR治療域回復後ヘパリン中止。',note:'血栓塞栓症高リスク群。必ず処方科と協議の上ブリッジング療法を検討。\n①ワルファリン中止3〜5日前（INR<1.5まで）\n②UFH静注（術前6〜12時間前中止）またはLMWH（術前24時間前中止）\n③手術翌日からワルファリン再開'};
    }
    const note=gi?'ブリッジング療法は原則不要（BRIDGE試験2015）。DOACへの一時変更も選択肢（JGES 2017）。':'ブリッジング療法は原則不要（BRIDGE試験2015）。';
    return{badge:'休薬',cls:'a-hold',hold:'3〜5日前（手技前日にINR<1.5確認）',restart:'手術翌日（止血確認後）',note};
  }

  if(drug.type==='DABI'){
    if(r==='low'){
      if(gi) return{badge:'当日朝スキップ',cls:'a-hold',hold:'当日朝1回スキップのみ（JGES 2017）',restart:'次回より通常通り内服',note:null};
      if(lp){
        if(!crcl) return{badge:'要CrCl確認',cls:'a-cons',hold:'CrClの入力が必要です',restart:'',note:null};
        const h=crcl==='lt30'?'禁忌（CrCl<30）。処方科に相談':crcl==='30to49'?'5日（120時間）以上前に最終服用（ASRA 2022）':'4〜5日（96〜120時間）前に最終服用（ASRA 2022）';
        return{badge:'休薬',cls:'a-hold',hold:h,restart:'穿刺後4時間以上経過後から再開',note:'腰椎穿刺：DOAC服用患者はASRA（neuraxial麻酔）基準に準じた管理を推奨（神経内科確認済み）。'};
      }
      if(!crcl) return{badge:'要CrCl確認',cls:'a-cons',hold:'CrClの入力が必要です',restart:'',note:null};
      const h=crcl==='lt30'?'禁忌（CrCl<30）。処方科に相談':crcl==='30to49'?'2日（48時間）前に中止':'1日（24時間）前に中止（PAUSE試験）';
      return{badge:'休薬',cls:'a-hold',hold:h,restart:'手術翌日（止血確認後）',note:'CrCl<30は禁忌。'};
    }
    if(anest){
      if(!crcl) return{badge:'要CrCl確認',cls:'a-cons',hold:'CrClの入力が必要です',restart:'',note:null};
      const h=crcl==='lt30'?'禁忌（CrCl<30）。処方科に相談':crcl==='30to49'?'5日（120時間）以上前に最終服用（2016年日本GL表7）':'4〜5日（96〜120時間）前に最終服用（2016年日本GL表7）';
      return{badge:'休薬',cls:'a-hold',hold:h,restart:'カテーテル抜去後6時間以上経過後から再開',note:'ダビガトランはCrCl<30で禁忌。カテーテル留置中は内服再開不可。'};
    }
    // high risk
    if(!crcl) return{badge:'要CrCl確認',cls:'a-cons',hold:'CrClの入力が必要です',restart:'',note:null};
    if(crcl==='lt30') return{badge:'禁忌',cls:'a-cons',hold:'CrCl<30：本剤は禁忌',restart:'処方科・薬剤部に相談',note:'ダビガトランはCrCl<30で禁忌。代替薬を処方科と協議すること。'};
    const h2=crcl==='30to49'?'4日（96時間）前に最終服用':'3日（72時間）前に最終服用';
    const r2=crcl==='30to49'?'処方科と相談の上決定':'止血確認後6〜8時間（低リスク）／24〜48時間（高リスク）';
    return{badge:'休薬',cls:'a-hold',hold:h2,restart:r2,note:'DOACにブリッジング療法は不要。緊急中和薬：イダルシズマブ（プリズバインド®）5g IV（RE-VERSE AD試験）。'};
  }

  if(drug.type==='XA'){
    const xn=id==='riva'?'リバーロキサバン':id==='apix'?'アピキサバン':'エドキサバン';
    if(r==='low'){
      if(gi) return{badge:'当日朝スキップ',cls:'a-hold',hold:'当日朝1回スキップのみ（JGES 2017）',restart:'次回より通常通り内服',note:null};
      if(lp){
        return{badge:'休薬',cls:'a-hold',hold:'最終服用から72時間（3日）以上前に中止（ASRA 2022）',restart:'穿刺後4時間以上経過後から再開',note:'腰椎穿刺：Xa因子阻害薬はASRA基準（72時間前中止）に準じた管理を推奨。'};
      }
      return{badge:'1日前',cls:'a-hold',hold:'1日（24時間）前に中止（PAUSE試験）',restart:'手術翌日（止血確認後）',note:null};
    }
    if(anest){
      const h=id==='apix'?'3日（72時間）前に最終服用（2016年日本GL表7）':'2日（48時間）前に最終服用（2016年日本GL表7）';
      return{badge:'休薬',cls:'a-hold',hold:h,restart:'カテーテル抜去後6時間以上経過後から再開',note:'区域麻酔（中リスク以上）の管理は2016年日本GL表7に準拠。'};
    }
    // high risk - need CrCl
    if(!crcl) return{badge:'要CrCl確認',cls:'a-cons',hold:'CrClの入力が必要です',restart:'',note:null};
    if(crcl==='lt30') return{badge:'原則禁忌',cls:'a-cons',hold:'CrCl<15で各薬剤禁忌。CrCl 15-29は原則適応外',restart:'処方科・薬剤部に相談',note:`${xn}：CrCl<15で禁忌。CrCl 15-29は原則適応外。使用中は処方科に必ず相談。`};
    if(crcl==='30to49') return{badge:'休薬（要相談）',cls:'a-cons',hold:'3日（72時間）前に最終服用（処方科と相談）',restart:'処方科と相談の上決定',note:`CrCl 15〜29の場合は原則適応外。処方科必須。CrCl 30〜49の場合は通常の3日前中止で可。`};
    return{badge:'休薬',cls:'a-hold',hold:'3日（72時間）前に最終服用（PAUSE試験）',restart:'止血確認後6〜8時間（低リスク）／24〜48時間（高リスク）',note:'DOACにブリッジング療法は不要。緊急中和薬：アンデキサネット アルファ（オンデキサ®）または4-PCC。'};
  }
  return null;
}

function hdr(step){
  const steps=['drug','dept','proc','extra','result'];
  const pct=(steps.indexOf(step)+1)/steps.length*100;
  return`<div class="header"><h1>抗血栓薬 取り扱いガイド</h1><small>神戸市立医療センター中央市民病院　医療安全管理室</small></div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>`;
}

function renderDrug(){
  const groups=[
    {label:'抗血小板薬（COX阻害）',ids:['asa']},
    {label:'抗血小板薬（P2Y12阻害）',ids:['clopi','prasu','tica','tilo']},
    {label:'抗血小板薬（PDE3阻害）',ids:['cilo']},
    {label:'抗凝固薬（VKA）',ids:['warf']},
    {label:'DOAC',ids:['dabi','riva','apix','edox']},
  ];
  let h=hdr('drug')+'<div class="content"><div class="step-title">STEP 1 / 4</div><div class="step-q">服用中の抗血栓薬を選んでください</div><div style="font-size:12px;color:#888;margin-bottom:4px">複数選択できます（DAPTなど）</div>';
  for(const g of groups){
    h+=`<div class="sub-label">${g.label}</div><div class="drug-grid">`;
    for(const id of g.ids){
      const d=DRUGS.find(x=>x.id===id);
      const sel=S.drugs.includes(id)?' sel':'';
      h+=`<div class="drug-item${sel}" onclick="toggleDrug('${id}')"><div class="dn">${d.name}</div><div class="db">${d.brand}</div></div>`;
    }
    h+='</div>';
  }
  const ok=S.drugs.length>0;
  h+=`<button class="btn btn-p" onclick="go('dept')" ${ok?'':'disabled'}>次へ：実施する手技を選択 →</button></div>`;
  return h;
}

function renderDept(){
  let h=hdr('dept')+'<div class="content"><div class="step-title">STEP 2 / 4</div><div class="step-q">実施する手技の診療科を選んでください</div><div class="dept-grid">';
  deptNames.forEach((d,i)=>{h+=`<button class="dept-btn" onclick="selDept(${i})">${d}</button>`;});
  h+=`</div><button class="btn btn-back" onclick="go('drug')">← 戻る</button></div>`;
  return h;
}

function renderProc(){
  const procs=DEPTS[getDept()];
  let h=hdr('proc')+`<div class="content"><div class="step-title">STEP 3 / 4</div><div class="step-q">${getDept()}の手技を選んでください</div>`;
  procs.forEach((p,i)=>{
    let lbl='',cls='';
    if(p.risk==='excluded'){lbl='本マニュアル適用除外';cls='rexcl';}
    else if(p.risk==='low'){lbl='低出血リスク';cls='rlow';}
    else if(p.risk==='high'){lbl='高出血リスク';cls='rhigh';}
    else{lbl='区域麻酔（中リスク）';cls='rmid';}
    h+=`<div class="proc-item" onclick="selProc(${i})"><div class="pname">${p.name}</div><div class="rbadge ${cls}">${lbl}</div></div>`;
  });
  h+=`<button class="btn btn-back" onclick="go('dept')">← 戻る</button></div>`;
  return h;
}

function renderExtra(){
  const qs=getQs();
  let h=hdr('extra')+'<div class="content"><div class="step-title">STEP 4 / 4</div><div class="step-q">追加情報を入力してください</div>';

  if(qs.includes('tap')){
    const s=S.extra.tap;
    h+=`<div class="extra-card"><div class="extra-title">【抗血小板薬】血栓塞栓症 高リスク群に該当しますか？</div><ul class="criteria">${AP_CRITERIA.map(c=>`<li>${c}</li>`).join('')}</ul><div class="yn-grid"><button class="yn-btn${s===true?' yn-yes':''}" onclick="setE('tap',true)">⚠️ いずれかに該当（高リスク）</button><button class="yn-btn${s===false?' yn-no':''}" onclick="setE('tap',false)">✓ 該当なし（低リスク）</button></div></div>`;
  }
  if(qs.includes('tac')){
    const s=S.extra.tac;
    h+=`<div class="extra-card"><div class="extra-title">【抗凝固薬】血栓塞栓症 高リスク群に該当しますか？</div><ul class="criteria">${AC_CRITERIA.map(c=>`<li>${c}</li>`).join('')}</ul><div class="yn-grid"><button class="yn-btn${s===true?' yn-yes':''}" onclick="setE('tac',true)">⚠️ いずれかに該当（高リスク）</button><button class="yn-btn${s===false?' yn-no':''}" onclick="setE('tac',false)">✓ 該当なし（低リスク）</button></div></div>`;
  }
  if(qs.includes('crcl')){
    const s=S.extra.crcl;
    h+=`<div class="extra-card"><div class="extra-title">腎機能（CrCl）を選んでください<br><span style="font-size:12px;font-weight:normal;color:#888">Cockcroft-Gault式で計算。術前直近の値を使用。</span></div><div class="crcl-grid"><button class="crcl-btn${s==='lt30'?' crcl-sel':''}" onclick="setE('crcl','lt30')">CrCl &lt; 30 mL/min</button><button class="crcl-btn${s==='30to49'?' crcl-sel':''}" onclick="setE('crcl','30to49')">CrCl 30〜49 mL/min</button><button class="crcl-btn${s==='50to79'?' crcl-sel':''}" onclick="setE('crcl','50to79')">CrCl 50〜79 mL/min</button><button class="crcl-btn${s==='gte80'?' crcl-sel':''}" onclick="setE('crcl','gte80')">CrCl ≥ 80 mL/min</button></div></div>`;
  }

  const ok=allAnswered();
  h+=`<button class="btn btn-p" onclick="go('result')" ${ok?'':'disabled'}>推奨を表示 →</button><button class="btn btn-back" onclick="go('proc')">← 戻る</button></div>`;
  return h;
}

function renderResult(){
  const p=getProc();
  const isPacer=p.sp==='pacemaker';
  const isGI=p.sp==='gi';
  const isDental=p.sp==='dental';
  const isExcluded=p.risk==='excluded';
  const apIds=S.drugs.filter(id=>['asa','clopi','prasu','tica','tilo'].includes(id));
  const isDAPT=apIds.length>=2;
  const isTriple=S.drugs.some(id=>['warf','dabi','riva','apix','edox'].includes(id))&&isDAPT;
  let riskText=p.risk==='excluded'?'本マニュアル適用除外':p.risk==='low'?'低出血リスク':p.risk==='high'?'高出血リスク':'区域麻酔（中リスク）';

  let h=hdr('result')+`<div class="content"><div class="sec-header"><h2>推奨結果</h2><p>${getDept()}｜${p.name}｜${riskText}</p></div>`;

  if(isExcluded){
    h+=`<div class="warn-box"><strong>⚠️ 本マニュアルの一般原則は適用されません</strong>${p.excludeNote}</div>`;
    h+=`<div class="contact"><strong>相談先</strong>処方科（循環器内科・脳神経内科・脳神経外科等）の専門プロトコルに従ってください。<br>不明な点は医療安全管理室（内線 3311）へ。</div>`;
    h+=`<button class="btn btn-back" onclick="go('proc')">← 前の画面に戻る</button>`;
    h+=`<button class="new-btn" onclick="reset()">最初からやり直す</button>`;
    h+=`<div class="foot">本ガイドは院内マニュアル（2026年6月9日改訂版）に基づきます。<br>個々の症例では担当科・処方科の判断を優先してください。</div></div>`;
    return h;
  }

  if(isTriple) h+=`<div class="warn-box"><strong>⚠️ 三剤併用（抗凝固薬＋DAPT）</strong>出血リスクが著しく上昇します。処方科と十分協議の上、個別に出血リスクと血栓リスクを評価してください。</div>`;
  else if(isDAPT) h+=`<div class="warn-box"><strong>⚠️ DAPT（二剤併用抗血小板療法）</strong>単剤中止の可否も含め、必ず循環器内科等の処方科と協議してください。</div>`;
  if(isGI) h+=`<div class="info-box"><strong>ℹ️ 消化器内視鏡（JGES 2017適用）</strong>一般的な手術・処置基準とは異なるルールが適用されます。</div>`;
  if(isPacer) h+=`<div class="info-box"><strong>ℹ️ ペースメーカー・ICD植込み術</strong>ワルファリン継続が推奨されます（AHA/ACC 2023 Class I）。ブリッジング療法は出血リスクを増加させるため施行しないこと。</div>`;

  for(const id of S.drugs){
    const drug=DRUGS.find(d=>d.id===id);
    const rec=drugRec(id);
    if(!rec)continue;
    h+=`<div class="result-card"><div class="rdrug">${drug.name}<span class="abadge ${rec.cls}">${rec.badge}</span></div><div style="font-size:11px;color:#aaa;margin-bottom:10px">${drug.brand}</div>`;
    if(rec.hold) h+=`<div class="rrow"><div class="rlabel">🗓 休薬開始</div><div class="rval">${rec.hold}</div></div>`;
    if(rec.restart) h+=`<div class="rrow"><div class="rlabel">✅ 再開時期</div><div class="rval">${rec.restart}</div></div>`;
    if(rec.note) h+=`<div class="rnotes">${rec.note}</div>`;
    h+=`</div>`;
  }

  if(isDental) h+=`<div class="info-box"><strong>ℹ️ 抜歯に関する特記事項（2025年版ガイドライン）</strong>抗凝固薬単剤服用患者の普通抜歯は原則継続のまま施行可（適切な局所止血処置を行うこと）。多剤併用患者は処方科と個別協議が必須。</div>`;

  h+=`<div class="contact"><strong>不明な点がある場合の相談先</strong>処方科（循環器内科・脳神経内科・血液内科等）<br>薬剤部（薬剤師による相談）<br>医療安全管理室（内線 3311）</div>`;
  const backStep=getQs().length>0?'extra':'proc';
  h+=`<button class="btn btn-back" onclick="go('${backStep}')">← 前の画面に戻る</button>`;
  h+=`<button class="new-btn" onclick="reset()">最初からやり直す</button>`;
  h+=`<div class="foot">本ガイドは院内マニュアル（2026年6月9日改訂版）に基づきます。<br>個々の症例では担当科・処方科の判断を優先してください。</div></div>`;
  return h;
}

function render(){
  const a=document.getElementById('app');
  if(S.step==='drug') a.innerHTML=renderDrug();
  else if(S.step==='dept') a.innerHTML=renderDept();
  else if(S.step==='proc') a.innerHTML=renderProc();
  else if(S.step==='extra') a.innerHTML=renderExtra();
  else a.innerHTML=renderResult();
}

function toggleDrug(id){
  S.drugs=S.drugs.includes(id)?S.drugs.filter(x=>x!==id):[...S.drugs,id];
  render();
}
function go(step){S.step=step;render();window.scrollTo(0,0);}
function selDept(i){S.deptIdx=i;S.procIdx=null;S.extra={tap:null,tac:null,crcl:null};go('proc');}
function selProc(i){
  S.procIdx=i;
  S.extra={tap:null,tac:null,crcl:null};
  go(getQs().length>0?'extra':'result');
}
function setE(k,v){S.extra[k]=v;render();}
function reset(){S={step:'drug',drugs:[],deptIdx:null,procIdx:null,extra:{tap:null,tac:null,crcl:null}};render();window.scrollTo(0,0);}

render();
</script>
</body>
</html>
